<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-brand">FUTARI STOCK</div>
    <section class="auth-step active" id="authLogin">
      <h2>ふたりの生活在庫</h2><p>メールアドレスでログインすると、2人の端末で在庫と買い物を同期できます。</p>
      <label class="field"><span>メールアドレス</span><input class="input" id="authEmail" type="email" autocomplete="email"></label>
      <label class="field"><span>パスワード</span><input class="input" id="authPassword" type="password" minlength="6" autocomplete="current-password"></label>
      <div class="auth-actions"><button class="auth-btn secondary" onclick="signUp()">新規登録</button><button class="auth-btn" onclick="signIn()">ログイン</button></div>
      <div class="auth-error" id="authError"></div>
    </section>
    <section class="auth-step" id="authHousehold">
      <h2>共有を始める</h2><p>最初の人は「新しく作る」、2人目は相手から届いた共有コードを入力してください。</p>
      <label class="field"><span>表示名</span><input class="input" id="joinName" value="ひかり"></label>
      <label class="field"><span>共有コード（参加する場合）</span><input class="input" id="joinCode" placeholder="FTR-XXXX-XXXX"></label>
      <div class="auth-actions"><button class="auth-btn secondary" onclick="createHousehold()">新しく作る</button><button class="auth-btn" onclick="joinHousehold()">コードで参加</button></div>
      <button class="text-btn logout-btn" onclick="signOut()">別のアカウントでログイン</button>
      <div class="auth-error" id="householdError"></div>
    </section>
  </div>
</div>
<div class="app">
<header class="header-actions-only"><div><span class="eyebrow">FUTARI STOCK</span><span class="sync-pill hidden" id="syncPill"><i class="sync-dot"></i><span id="syncText">同期済み</span></span></div><div class="head-actions"><button class="icon-btn" id="themeToggle" aria-label="テーマ切替"></button><button class="icon-btn settings-button" data-go="settings" aria-label="設定"></button></div></header>
<main id="main"><section id="view-home" class="view active"></section><section id="view-shopping" class="view"></section><section id="view-fridge" class="view"></section><section id="view-supplies" class="view"></section><section id="view-settings" class="view"></section></main>
<nav><button class="nav-btn active" data-go="home" data-icon="home" data-label="ホーム">ホーム</button><button class="nav-btn" data-go="shopping" data-icon="cart" data-label="買い物">買い物<i class="count" id="shoppingCount">0</i></button><button class="nav-btn" data-go="fridge" data-icon="fridge" data-label="冷蔵庫">冷蔵庫</button><button class="nav-btn" data-go="supplies" data-icon="package" data-label="日用品">日用品</button></nav>
<div class="modal hidden" id="modal"><form class="sheet" id="itemForm"><div class="sheet-head"><h3 id="modalTitle">追加</h3><button type="button" class="icon-btn" id="closeModal"></button></div><div id="formFields"></div><button class="submit" type="submit">登録する</button></form></div><div class="toast hidden" id="toast"></div>
</div>

function renderShopping(){const v=shopping,a=v.filter(x=>!x.done),d=v.filter(x=>x.done);$('#view-shopping').innerHTML=`<h2>買い物リスト</h2><p class="subtitle">${a.length}件の買い物があります</p><div class="card search">${icons.search}<input placeholder="買うものを検索" oninput="filterShopping(this.value)"></div><div id="shopList">${shoppingMarkup(a,d)}</div><button class="fab" onclick="openModal('shopping')">${icons.plus}追加する</button>`}function shoppingMarkup(a,d){return `<div class="list">${a.length?a.map(shopRow).join(''):`<div class="empty">買うものはありません</div>`}</div>${d.length?`<div class="section-title" style="margin:24px 0 10px;color:var(--muted);font-size:12px">購入済み</div><div class="list completed">${d.map(shopRow).join('')}</div>`:''}`}function filterShopping(q){const v=shopping.filter(x=>x.name.includes(q));$('#shopList').innerHTML=shoppingMarkup(v.filter(x=>!x.done),v.filter(x=>x.done))}function shopRow(x){return `<div class="card row"><button class="check ${x.done?'done':''}" onclick="toggleBought('${x.id}')">${icons.check}</button><div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="meta">${x.quantity}${esc(x.unit)} ・ ${esc(x.requestedBy)}が追加</div></div><span class="badge type">${esc(x.category)}</span><button class="trash" onclick="removeShopping('${x.id}')">${icons.trash}</button></div>`}

function syncStatus(t){const e=document.getElementById('syncText');if(e)e.textContent=t}
async function signUp(){authMessage('authError');const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const {data,error}=await sb.auth.signUp({email,password});if(error)return authMessage('authError',error.message);if(!data.session)return authMessage('authError','確認メールを開いて登録を完了してください。');await afterAuth(data.user)}
async function signIn(){authMessage('authError');const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return authMessage('authError','メールアドレスまたはパスワードを確認してください。');await afterAuth(data.user)}
async function signOut(){cloud.ready=false;if(cloud.channel)await sb.removeChannel(cloud.channel);await sb.auth.signOut();location.reload()}
async function afterAuth(user){cloud.user=user;const {data,error}=await sb.from('household_members').select('household_id,display_name,households(share_code)').eq('user_id',user.id).maybeSingle();if(error){authMessage('authError',error.message);return}if(!data){showAuthStep('authHousehold');return}cloud.householdId=data.household_id;if(data.households?.share_code)profile.shareCode=data.households.share_code;await loadCloudState();subscribeCloud();hideAuth()}
async function createHousehold(){authMessage('householdError');const name=document.getElementById('joinName').value.trim()||'自分';const {data,error}=await sb.rpc('create_household',{display_name:name});if(error)return authMessage('householdError',error.message);cloud.householdId=data[0].household_id;profile.myName=name;profile.shareCode=data[0].share_code;await pushCloudState(true);subscribeCloud();hideAuth();render()}
async function joinHousehold(){authMessage('householdError');const name=document.getElementById('joinName').value.trim()||'相手',code=document.getElementById('joinCode').value.trim();if(!code)return authMessage('householdError','共有コードを入力してください。');const {data,error}=await sb.rpc('join_household',{input_code:code,display_name:name});if(error)return authMessage('householdError','共有コードが見つからないか、すでに2人参加しています。');cloud.householdId=data[0].household_id;profile.myName=name;profile.shareCode=data[0].share_code;await loadCloudState();subscribeCloud();hideAuth();render()}
function statePayload(){return {items,shopping,profile,theme}}
function applyCloudData(d){if(!d||typeof d!=='object')return;cloud.applying=true;if(Array.isArray(d.items))items=d.items;if(Array.isArray(d.shopping))shopping=d.shopping;if(d.profile)profile={...profile,...d.profile};if(d.theme){theme=d.theme;document.documentElement.dataset.theme=theme}render();applyStaticIcons();cloud.applying=false}
async function loadCloudState(){syncStatus('読込中');const {data,error}=await sb.from('household_state').select('data').eq('household_id',cloud.householdId).maybeSingle();if(error){toast('クラウド読込に失敗しました');return}if(data?.data&&Object.keys(data.data).length)applyCloudData(data.data);else await pushCloudState(true);cloud.ready=true;syncStatus('同期済み')}
function scheduleCloudSave(){if(!cloud.ready||cloud.applying||!cloud.householdId)return;syncStatus('保存中');clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>pushCloudState(false),450)}
async function pushCloudState(force=false){if(!cloud.householdId||!cloud.user)return;const payload=statePayload(),serialized=JSON.stringify(payload);if(!force&&serialized===cloud.lastSent){syncStatus('同期済み');return}const {error}=await sb.from('household_state').upsert({household_id:cloud.householdId,data:payload,updated_by:cloud.user.id,updated_at:new Date().toISOString()},{onConflict:'household_id'});if(error){syncStatus('同期エラー');console.error(error);return}cloud.lastSent=serialized;cloud.ready=true;syncStatus('同期済み')}
function subscribeCloud(){if(cloud.channel)sb.removeChannel(cloud.channel);cloud.channel=sb.channel('household-'+cloud.householdId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'household_state',filter:`household_id=eq.${cloud.householdId}`},payload=>{if(payload.new.updated_by===cloud.user?.id)return;applyCloudData(payload.new.data);syncStatus('同期済み')}).subscribe()}
async function initCloud(){const {data}=await sb.auth.getSession();if(data.session)await afterAuth(data.session.user);else showAuthStep('authLogin')}

$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));$('#themeToggle').addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));$('#closeModal').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.documentElement.dataset.theme=theme;applyStaticIcons();render();initCloud();
</script>
</body></html>
