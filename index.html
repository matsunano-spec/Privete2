<script>
const SUPABASE_URL='https://utbetzftmkrosidwpjke.supabase.co', SUPABASE_KEY='sb_publishable_983xq5c_MenCahnkFJ9IXw_t9tSJRbF';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const cats=['すべて','家具','家電','キッチン','食器','日用品','バス・洗面','寝具','掃除・洗濯','収納','その他'];
let items=[],cat='すべて',mode='すべて',editing=null,currentListId=localStorage.getItem('home_list_id')||'',currentCode=localStorage.getItem('home_share_code')||'',channel=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(u){try{return ['http:','https:'].includes(new URL(u).protocol)}catch{return false}}
function randomCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:8},(_,i)=>i===4?'-':a[Math.floor(Math.random()*a.length)]).join('')}
function status(t){const el=$('#doneText'); if(el) el.textContent=t}
async function createList(){for(let n=0;n<5;n++){const code=randomCode();const {data,error}=await db.from('lists').insert({share_code:code}).select().single();if(!error){setList(data.id,data.share_code);return true}}alert('共有リストを作成できませんでした');return false}
function setList(id,code){currentListId=id;currentCode=code;localStorage.setItem('home_list_id',id);localStorage.setItem('home_share_code',code);$('#copy').textContent=code+'　コピー'}
async function loadItems(){if(!currentListId)return;const {data,error}=await db.from('items').select('*,item_links(*)').eq('list_id',currentListId).order('sort_order',{ascending:true}).order('created_at',{ascending:true});if(error){console.error(error);status('同期エラー');return}items=(data||[]).map(x=>({...x,urls:(x.item_links||[]).sort((a,b)=>a.sort_order-b.sort_order).map(l=>({label:l.label,url:l.url}))}));render()}
function subscribe(){if(channel)db.removeChannel(channel);channel=db.channel('home-list-'+currentListId).on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'list_id=eq.'+currentListId},loadItems).on('postgres_changes',{event:'*',schema:'public',table:'item_links'},loadItems).subscribe()}
async function ensureList(){if(currentListId){const {data}=await db.from('lists').select('id,share_code').eq('id',currentListId).maybeSingle();if(data){setList(data.id,data.share_code);await loadItems();subscribe();return}}if(await createList()){await loadItems();subscribe()}}
function render(){let q=$('#search').value.toLowerCase(),f=items.filter(i=>(cat==='すべて'||i.category===cat)&&(mode==='すべて'||mode==='買う'&&i.source==='購入'||mode==='持っていく'&&i.source==='持っていく')&&(i.name+(i.memo||'')).toLowerCase().includes(q)),done=items.filter(i=>i.done).length;$('#remain').textContent=items.length-done;$('#doneText').textContent=`${done} / ${items.length} 完了`;$('#bar').style.width=(items.length?done/items.length*100:0)+'%';$('#shown').textContent=f.length+' ITEMS';$('#sectionTitle').textContent=mode==='すべて'?'すべてのアイテム':mode+'もの';$('#list').innerHTML=f.length?f.map(i=>`<div class="item ${i.done?'isdone':''}"><div class="row"><button class="check ${i.done?'done':''}" data-check="${i.id}">${i.done?'<svg viewBox="0 0 20 20" width="13" height="13"><path d="M4.7 10.3 8.3 14l7-8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</button><div class="main" data-edit="${i.id}"><div class="nameRow"><span class="name">${esc(i.name)}</span><div class="badges"><span class="badge">${esc(i.category)}</span><span class="badge">${esc(i.source)}</span></div></div>${i.memo?`<div class="memo">${esc(i.memo)}</div>`:''}</div></div>${i.urls.filter(x=>valid(x.url)).length?`<div class="links">${i.urls.filter(x=>valid(x.url)).map((x,n)=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label||('候補 '+(n+1)))} ↗</a>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty">該当するものはありません</div>';document.querySelectorAll('[data-check]').forEach(b=>b.onclick=async()=>{const i=items.find(x=>x.id===b.dataset.check);await db.from('items').update({done:!i.done}).eq('id',i.id);await loadItems()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(items.find(x=>x.id===b.dataset.edit)))}
function drawChips(){$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;drawChips();render()})}
function openEdit(i){editing=i?JSON.parse(JSON.stringify(i)):{id:null,name:'',category:'家具',source:'購入',memo:'',done:false,urls:[{label:'',url:''}]};$('#editTitle').textContent=i?'アイテムを編集':'アイテムを追加';$('#name').value=editing.name;$('#category').value=editing.category;$('#source').value=editing.source;$('#memo').value=editing.memo||'';$('#deleteItem').hidden=!editing.id;drawUrls();$('#editOverlay').classList.add('open')}
function drawUrls(){if(!editing.urls.length)editing.urls=[{label:'',url:''}];$('#urls').innerHTML=editing.urls.map((x,n)=>`<div style="margin-bottom:9px;padding:8px;border:1px solid var(--line);border-radius:9px"><input class="input urllabel" value="${esc(x.label||'')}" placeholder="表示名（例：Panasonic）" style="margin-bottom:6px"><div class="urlrow"><input class="input urlvalue" value="${esc(x.url||'')}" placeholder="https://...">${editing.urls.length>1?`<button data-rm="${n}">×</button>`:''}</div></div>`).join('');document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{editing.urls.splice(+b.dataset.rm,1);drawUrls()})}
async function saveItem(){const name=$('#name').value.trim();if(!name)return;const row={list_id:currentListId,name,category:$('#category').value,source:$('#source').value,memo:$('#memo').value.trim(),done:editing.done||false,sort_order:editing.sort_order||Date.now()};let id=editing.id;if(id){const {error}=await db.from('items').update(row).eq('id',id);if(error)return alert('保存エラー: '+error.message);await db.from('item_links').delete().eq('item_id',id)}else{const {data,error}=await db.from('items').insert(row).select().single();if(error)return alert('保存エラー: '+error.message);id=data.id}const links=[...document.querySelectorAll('.urlvalue')].map((x,n)=>({item_id:id,label:document.querySelectorAll('.urllabel')[n].value.trim(),url:x.value.trim(),sort_order:n})).filter(x=>x.url);if(links.length){const {error}=await db.from('item_links').insert(links);if(error)return alert('URL保存エラー: '+error.message)}$('#editOverlay').classList.remove('open');await loadItems()}
async function deleteCurrentItem(){
  if(!editing||!editing.id)return;
  if(!confirm(`「${editing.name}」を削除しますか？
この操作は2人の共有リストに反映されます。`))return;
  const button=$('#deleteItem'),saveButton=$('#save');
  button.disabled=true;saveButton.disabled=true;button.textContent='削除中…';
  const {error:linkError}=await db.from('item_links').delete().eq('item_id',editing.id);
  if(linkError){alert('候補URLの削除に失敗しました: '+linkError.message);button.disabled=false;saveButton.disabled=false;button.textContent='このアイテムを削除';return}
  const {error:itemError}=await db.from('items').delete().eq('id',editing.id).eq('list_id',currentListId);
  if(itemError){alert('アイテムの削除に失敗しました: '+itemError.message);button.disabled=false;saveButton.disabled=false;button.textContent='このアイテムを削除';return}
  $('#editOverlay').classList.remove('open');
  editing=null;
  button.disabled=false;saveButton.disabled=false;button.textContent='このアイテムを削除';
  await loadItems()
}
